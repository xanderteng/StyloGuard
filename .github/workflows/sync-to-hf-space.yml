name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Backend files & Push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # 1. Copy the backend directory (including dotfiles like .gitignore and .dockerignore) to a temp folder
          mkdir -p ../hf_space
          cp -r backend/. ../hf_space/

          # 2. Initialize git and commit in the temp folder
          cd ../hf_space
          git init
          git checkout -b main
          git add .
          git commit -m "Sync backend to Hugging Face Spaces"

          # 3. Force push to the Space's main branch
          git push --force https://${{ vars.HF_USERNAME }}:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ vars.HF_USERNAME }}/${{ vars.SPACE_NAME }} main
