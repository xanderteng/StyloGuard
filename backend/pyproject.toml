[project]
name = "styloguard-backend"
version = "0.1.0"
description = "FastAPI backend for the StyloGuard stylometry MVP."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.6,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
]

[tool.uv]
package = false
